<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappa Pacchi - Smistamento Magazzino</title>
  
  <!-- Leaflet CSS (Mappa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f6f9; color: #333; height: 100vh; display: flex; flex-direction: column; }
    
    header { background: #1e293b; color: #fff; padding: 12px 16px; text-align: center; font-size: 1.1rem; font-weight: bold; }
    
    #controls { padding: 12px; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 8px; }
    
    .btn { background: #2563eb; color: #fff; border: none; padding: 12px 16px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:active { background: #1d4ed8; }
    .btn-confirm { background: #16a34a; margin-top: 6px; }
    .btn-confirm:active { background: #15803d; }
    .btn-confirm:disabled { background: #9ca3af; cursor: not-allowed; }
    
    #scanner-container { display: none; position: relative; width: 100%; height: 220px; background: #000; border-radius: 8px; overflow: hidden; }
    #video { width: 100%; height: 100%; object-fit: cover; }
    
    #read-result { font-weight: bold; font-size: 0.95rem; color: #1e293b; background: #f1f5f9; padding: 8px 12px; border-radius: 6px; word-break: break-all; min-height: 38px; display: flex; align-items: center; }
    
    #map { flex: 1; width: 100%; }
    
    .status-msg { font-size: 0.85rem; color: #64748b; text-align: center; }
  </style>
</head>
<body>

  <header>📦 Smistamento Pacchi & Mappatura</header>

  <div id="controls">
    <button id="btn-toggle-cam" class="btn">📷 Apri / Chiudi Fotocamera</button>
    
    <div id="scanner-container">
      <video id="video" playsinline></video>
    </div>

    <div>
      <span style="font-size: 0.8rem; color: #64748b; font-weight: bold;">TESTO/INDIRIZZO RILEVATO:</span>
      <div id="read-result">Inquadra un codice o indirizzo...</div>
    </div>

    <button id="btn-save" class="btn btn-confirm" disabled>📍 Salva Posizione e Aggiungi a Mappa</button>
    <div id="status-msg" class="status-msg"></div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS (Mappa) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- ZXing JS (Lettore Codici / QR) -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <script>
    // Inizializzazione Mappa (Centrata su Italia)
    const map = L.map('map').setView([45.4642, 9.1900], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let codeReader = null;
    let isScanning = false;
    let currentDetectedText = "";
    const markers = [];

    const btnToggleCam = document.getElementById('btn-toggle-cam');
    const scannerContainer = document.getElementById('scanner-container');
    const readResult = document.getElementById('read-result');
    const btnSave = document.getElementById('btn-save');
    const statusMsg = document.getElementById('status-msg');

    // Toggle Fotocamera
    btnToggleCam.addEventListener('click', () => {
      if (isScanning) {
        stopScanner();
      } else {
        startScanner();
      }
    });

    function startScanner() {
      codeReader = new ZXing.BrowserMultiFormatReader();
      scannerContainer.style.display = 'block';
      isScanning = true;
      statusMsg.innerText = "Fotocamera attiva. Inquadra il codice o indirizzo.";

      codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
        if (result) {
          currentDetectedText = result.getText();
          readResult.innerText = currentDetectedText;
          btnSave.disabled = false; // Abilita il tasto di salvataggio
        }
      }).catch(err => {
        console.error(err);
        statusMsg.innerText = "Errore nell'accesso alla fotocamera.";
      });
    }

    function stopScanner() {
      if (codeReader) {
        codeReader.reset();
      }
      scannerContainer.style.display = 'none';
      isScanning = false;
      statusMsg.innerText = "Fotocamera disattivata.";
    }

    // Tasto "Salva Posizione"
    btnSave.addEventListener('click', async () => {
      if (!currentDetectedText) return;

      statusMsg.innerText = "Ricerca posizione sulla mappa...";
      btnSave.disabled = true;

      try {
        // Geocodifica con Nominatim (OpenStreetMap)
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(currentDetectedText)}`);
        const data = await response.json();

        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);

          // Aggiungi marker sulla mappa
          const marker = L.marker([lat, lon]).addTo(map)
            .bindPopup(`<b>Pacco Mappato</b><br>${currentDetectedText}`)
            .openPopup();
          
          markers.push(marker);

          // Centra la mappa sul nuovo punto
          map.setView([lat, lon], 13);

          statusMsg.innerText = "✅ Pacco memorizzato e posizionato sulla mappa!";
          readResult.innerText = "Inquadra un altro codice...";
          currentDetectedText = "";
        } else {
          statusMsg.innerText = "❌ Indirizzo non trovato sulla mappa. Verificare il testo.";
          btnSave.disabled = false;
        }
      } catch (error) {
        console.error(error);
        statusMsg.innerText = "⚠️ Errore durante la connessione al servizio mappe.";
        btnSave.disabled = false;
      }
    });
  </script>
</body>
</html>
